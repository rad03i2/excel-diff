[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "excel-diff-radwan"
version = "1.0.0"
description = "Compare Excel workbooks and CSV files with deterministic, automation-friendly reports."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Radwan Abdulhadi Ahmed"}]
dependencies = ["openpyxl>=3.1,<4"]
keywords = ["excel", "xlsx", "csv", "diff", "spreadsheet"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
excel-diff = "excel_diff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
